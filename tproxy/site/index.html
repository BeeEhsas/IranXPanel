<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f6f7f9;
    color: #1c2430;
    padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #10141b; color: #dfe6ee; }
    .card { box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  }
  .card {
    max-width: 560px;
    width: 100%;
    background: #fff;
    border-radius: 16px;
    padding: 40px 36px;
    box-shadow: 0 8px 30px rgba(16,24,40,.08);
    text-align: center;
  }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 20px;
    border-radius: 16px;
    background: linear-gradient(135deg, #4f8ef7, #7c5cf0);
    display: grid; place-items: center;
    color: #fff; font-size: 26px; font-weight: 700;
  }
  h1 { font-size: 22px; margin-bottom: 10px; }
  p  { font-size: 14.5px; line-height: 1.7; opacity: .75; }
  .fa { direction: rtl; margin-top: 14px; }
  footer { margin-top: 26px; font-size: 12px; opacity: .45; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">N</div>
    <h1>Welcome</h1>
    <p>This page is under maintenance. Please check back a little later.</p>
    <p class="fa">این صفحه در حال به‌روزرسانی است. کمی بعد دوباره سر بزنید.</p>
    <footer>© 2026</footer>
  </main>
</body>
</html>
