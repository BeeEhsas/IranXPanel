services:
  - type: web
    name: webapp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT --timeout 0
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DOMAIN
        sync: false
      - key: WS_PATH
        value: ws
      - key: XHTTP_PATH
        value: xh
      # stream-up keeps the uplink on one long-lived request: 2 requests per connection
      # instead of one per chunk, which matters when a metered relay is in front.
      - key: XHTTP_MODE
        value: stream-up
      # The decoy cover site: public paths answer with a small random site until
      # the panel is unlocked with the secret path (printed at start-up).
      - key: COVER_MODE
        value: "1"
      - key: DB_PATH
        value: /tmp/panel.db
