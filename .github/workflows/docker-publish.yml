# Publishes the panel as a container image on GitHub's own registry (GHCR).
#
# Why: a hosting platform can create a service straight from a public image, and
# unlike a repo source that needs no account integration on the *user's* side.
#
# Runs entirely on GitHub — nothing to install locally.
# After the first successful run, make the package public once:
#   your profile → Packages → <package> → Package settings → Change visibility → Public
#
# The image name comes from the repository variable CONTAINER_NAME; without it the
# repository name is used, which is what the deployer Worker points at.

name: Publish container image

on:
  push:
    branches: [main, master]
    paths:
      - "main.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ vars.CONTAINER_NAME || github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive lowercase image name
        id: name
        run: echo "value=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.name.outputs.value }}:latest
            ${{ env.REGISTRY }}/${{ steps.name.outputs.value }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show the image reference
        run: |
          echo "### Image published :rocket:" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Set this as the image reference in your deployer:' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '${{ env.REGISTRY }}/${{ steps.name.outputs.value }}:latest' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Remember to make the package **public** once, under Packages → Package settings.' >> $GITHUB_STEP_SUMMARY
