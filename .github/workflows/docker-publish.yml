# Publishes the panel as a container image on GitHub's own registry (GHCR).
#
# Why: a hosting platform can create a service straight from a public image, and
# unlike a repo source that needs no account integration on the *user's* side.
#
# Runs entirely on GitHub — nothing to install locally.
# After the first successful run, make the package public once:
#   your profile → Packages → <package> → Package settings → Change visibility → Public
#
# Two images are published from the same build:
#   * IMAGE_NAME       — the neutral name ("webapp") that the deployer points at, so a
#                        hosting platform never sees a telling package name;
#   * LEGACY_IMAGE_NAME — the repository path, kept for deployments that still point
#                        at the old package. Delete it once nothing uses it.

name: Publish container image

on:
  push:
    branches: [main, master]
    paths:
      - "main.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ vars.CONTAINER_NAME || format('{0}/webapp', github.repository_owner) }}
  LEGACY_IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive lowercase image names
        id: name
        run: |
          echo "value=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "legacy=$(echo '${{ env.LEGACY_IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push (neutral name)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.name.outputs.value }}:latest
            ${{ env.REGISTRY }}/${{ steps.name.outputs.value }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (legacy name)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.name.outputs.legacy }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show the image reference
        run: |
          echo "### Image published :rocket:" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Set this as the image reference in your deployer:' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '${{ env.REGISTRY }}/${{ steps.name.outputs.value }}:latest' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Remember to make the package **public** once, under Packages → Package settings.' >> $GITHUB_STEP_SUMMARY
