# ─────────────────────────────────────────────
#  IranX Panel — environment variable reference
#  Set these in Railway → Variables tab
# ─────────────────────────────────────────────
# The panel username is always "admin" and is never asked for.
# The password is chosen on your first visit to the panel.

[required]
SECRET_KEY = "long_random_string_here"  # signs the JWT session cookie
DOMAIN     = "your-app.up.railway.app"  # public domain, no https://

[transports]
WS_PATH    = "ws"   # path for VLESS + WebSocket + TLS
XHTTP_PATH = "xh"   # path for VLESS + XHTTP + TLS  (must differ from WS_PATH)

[optional]
ADMIN_PASSWORD = ""              # pre-seed the password, skips the setup page
DB_PATH        = "/tmp/panel.db" # use /data/panel.db with a persistent volume
DEVICE_WINDOW  = "300"           # seconds an IP counts as an active device
LIVE_WINDOW    = "60"            # seconds an IP shows as "connected right now"
SESSION_IDLE   = "90"            # seconds before an idle XHTTP session is dropped
PANEL_TITLE    = "IranX Panel"

[relay]
# If the host's own domain is unreachable from some networks, put a relay in front
# (e.g. a Cloudflare Worker that proxies to this panel). The panel keeps running on
# DOMAIN, but every config and subscription link it hands out points at RELAY_DOMAIN.
# Leave empty when there is no relay.
RELAY_DOMAIN = ""

[keepalive]
# Only for hosts that idle a service out — Render's free plan sleeps after ~15 minutes.
# The service pings its own public /healthz so the platform sees inbound traffic.
# READ THIS FIRST: it burns your free instance hours (24/7 is ~730 of Render's 750 per
# month) and it does NOT protect the database — a redeploy or a platform restart still
# wipes /tmp. For anything real, use Railway with a volume instead.
# Requires DOMAIN to be set correctly.
KEEPALIVE         = "0"    # "1" to enable
KEEPALIVE_MINUTES = "10"   # ping interval; must be under the host's idle timeout
